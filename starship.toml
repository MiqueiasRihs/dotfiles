# ~/.config/starship.toml

# Adiciona uma linha vazia entre os comandos (respira o visual)
add_newline = true

# Define a ordem dos módulos
format = """
$directory\
$git_branch\
$git_status\
$docker_context\
$nodejs\
$python\
$golang\
$rust\
$java\
$php\
$cmd_duration\
$line_break\
$character"""

# Timeout para não travar o terminal em repositórios git gigantes
command_timeout = 1000

# ------------------------------------------------------------------------------
# 1. DIRETÓRIO (Onde estou?)
# ------------------------------------------------------------------------------
[directory]
style = "bold cyan"
read_only = " 🔒"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($style) "

# ------------------------------------------------------------------------------
# 2. GIT (Essencial para Dev)
# ------------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "🏳"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = "++"
renamed = "»"
deleted = "🗑"

# ------------------------------------------------------------------------------
# 3. LINGUAGENS (Só aparecem se tiver arquivos do projeto na pasta)
# ------------------------------------------------------------------------------
[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [$symbol($version )($virtualenv )]($style)"

[golang]
symbol = "🐹 "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version )]($style)"

[java]
symbol = "☕ "
style = "red"
format = "via [$symbol($version )]($style)"

[php]
symbol = "🐘 "
style = "blue"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = "🐳 "
style = "blue"
format = "via [$symbol$context]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ------------------------------------------------------------------------------
# 4. UTILITÁRIOS
# ------------------------------------------------------------------------------
# Mostra quanto tempo o comando demorou (se for mais de 2 segundos)
[cmd_duration]
min_time = 2000
format = "tome [$duration](bold yellow)"

# ------------------------------------------------------------------------------
# 5. O PROMPT (Linha de baixo)
# ------------------------------------------------------------------------------
[line_break]
disabled = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"